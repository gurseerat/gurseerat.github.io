career-profile:
  title: Career Profile
  summary: |
    Senior Full Stack Developer with 9 years of experience building scalable, enterprise-grade web applications for global clients across aerospace, EdTech, and public sector domains. Expertise in Angular (7+), Node.js, MongoDB, and .NET Core, with a strong focus on frontend architecture, performance optimization, and maintainable codebases. Proven ability to modernize legacy systems, design reusable UI components, and deliver user-centric solutions in distributed, cross-functional teams. Experienced in translating complex business requirements into robust technical implementations and mentoring developers to drive engineering excellence.

