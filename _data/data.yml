      link: "https://www.npmjs.com/package/ngrx-store-cli"
      tagline: "A schematic for Angular that simplifies the creation of NgRx store slices — including actions, reducers, selectors, and automatic integration with your app-state.ts."

    - title: TabStack (Chrome Extension)
      link: "https://chromewebstore.google.com/detail/kllhbpmenkejgnhmioaomhanmpnacpkd?utm_source=item-share-cb"
