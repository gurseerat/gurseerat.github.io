{% assign achievements = site.data.data.sidebar.achievements %}
{% if achievements %}
<div class="achievements-container container-block">

    <h2 class="container-block-title">
        {{ achievements.title }}
    </h2>

    <ul class="list-styled achievements-list">
        {% for achievement in achievements.items %}

        <li>{{ achievement }}</li>

        {% endfor %}
    </ul>

</div><!--//achievements-->
{% endif %}
