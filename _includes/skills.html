{% assign skills = site.data.data.sidebar.skills %}
{% if skills %}
<div class="skills-container container-block">
  <h2 class="container-block-title">
    {{ skills.title }}
  </h2>

  <div class="skillset">
    {% for category in skills.categories %}
    <div class="item">
      <h5 class="category-title">{{ category.name }}</h5>
      <ul class="skill-list list-styled">
        <li>
          {{ category.items | join: ", " }}
        </li>
      </ul>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
